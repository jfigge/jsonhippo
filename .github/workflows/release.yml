name: Release

# Builds the six desktop installers on every push to main, and publishes them
# as a GitHub Release the first time main is pushed with a new version:
#
#   macOS    JsonHippo-<v>-arm64.dmg          JsonHippo-<v>-x64.dmg
#   Windows  JsonHippo-Setup-<v>-x64.exe      JsonHippo-Setup-<v>-arm64.exe
#   Linux    JsonHippo-<v>-x86_64.AppImage    JsonHippo-<v>-arm64.AppImage
#
# THE VERSION IS THE SWITCH. <v> is package.json's "version". A push whose
# version already has a tag (v<v>) builds and signs everything — proving the
# pipeline still works — and keeps the installers as run artifacts, but
# publishes nothing; bump the version and push to release. Rest Hippo and Chip
# Hippo release on a pushed tag instead (`make release`); here the tag is made
# by the publish step, from the version, on the commit that was pushed.
# `workflow_dispatch` runs the same build by hand and never publishes.
#
# hippoherd.com/jsonhippo/about/ offers whatever the latest Release holds: its
# own workflow reads every hippo's releases daily (07:15 UTC) and on each push
# there. Nothing here needs to know that repository exists.
#
# ── Secrets and variables (Settings → Secrets and variables → Actions) ───────
# NONE OF THESE EXIST ON THIS REPOSITORY YET. They are the herd's credentials,
# already held by Rest Hippo and Chip Hippo, and have to be added here by hand
# (`make sync-mac RELEASE_ENV=../resthippo/release.env` does the first five).
#
#   macOS signing (Developer ID Application — the same certificate for every app)
#     secrets.CSC_LINK                     base64 of the Developer ID .p12
#     secrets.CSC_KEY_PASSWORD             its export password
#   macOS notarization — EITHER the Apple ID route (Rest Hippo's) …
#     secrets.APPLE_ID                     the developer account's Apple ID
#     secrets.APPLE_APP_SPECIFIC_PASSWORD  an app-specific password for it
#     secrets.APPLE_TEAM_ID                the 10-character team id
#   … OR the App Store Connect API key route (Chip Hippo's)
#     secrets.APPLE_API_KEY_ID             the .p8 key's id
#     secrets.APPLE_API_ISSUER             its issuer id (a UUID)
#     secrets.APPLE_API_KEY_BASE64         base64 of AuthKey_<id>.p8
#   Windows signing — Authenticode through SignPath Foundation, Rest Hippo's
#   route. Rest Hippo has the steps but not the configuration (none of these
#   is set there either), and Chip Hippo ships Windows unsigned, so there is NO
#   Windows certificate in the herd to reuse. SignPath Foundation approves and
#   configures each open-source project separately, so JsonHippo needs its own
#   SignPath project before these mean anything. Until the organization id is
#   set the signing steps are skipped and the Windows installers are UNSIGNED.
#     vars.SIGNPATH_ORGANIZATION_ID        enables Windows signing when set
#     vars.SIGNPATH_PROJECT_SLUG           this repo's SignPath project
#     vars.SIGNPATH_SIGNING_POLICY_SLUG    e.g. release-signing
#     vars.SIGNPATH_ARTIFACT_CONFIG_SLUG   the artifact configuration
#     secrets.SIGNPATH_API_TOKEN           the SignPath CI user's API token
#   (and the SignPath GitHub App installed on this repository).
#   Linux AppImages are not signed, here or by any hippo.
#
# Unlike the siblings, a release is NOT published while the macOS secrets are
# missing. Their releases are deliberate (a tag someone pushed); here any push
# to main can release, so an unconfigured repository would otherwise publish
# unsigned, un-notarized Mac builds — which Gatekeeper refuses to open — the
# first time it is pushed. The build still runs, unsigned, so the pipeline is
# provable before the certificates arrive.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read # only the release job writes, and it elevates below

# One release run at a time; a second push waits rather than racing the first
# to the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ── The web app's own checks: nothing is packaged that fails them ───────────
  check:
    name: Lint, validate & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: make check
        run: make check

  # ── Decide whether this run publishes ───────────────────────────────────────
  plan:
    name: Decide what to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Secrets cannot appear in an `if:`, so whether they are set is worked out
      # here and passed on as an output. Only "is it empty" leaves this step.
      - name: Version, tag and signing readiness
        id: plan
        env:
          HAVE_CSC: ${{ secrets.CSC_LINK != '' }}
          HAVE_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAVE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # ls-remote exits 2 for "no such tag"; anything else non-zero is a
          # failure to ask, which must not be mistaken for "not released yet".
          TAGGED=0
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null || TAGGED=$?
          if [ "$TAGGED" -ne 0 ] && [ "$TAGGED" -ne 2 ]; then
            echo "::error::Could not list the tags on origin (git ls-remote exited ${TAGGED})."
            exit 1
          fi
          PUBLISH=false
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "::notice::Manual run: builds ${TAG}, publishes nothing."
          elif [ "$TAGGED" -eq 0 ]; then
            echo "::notice::${TAG} is already released. Bump \"version\" in package.json and push to publish a new one."
          elif [ "$HAVE_CSC" != "true" ]; then
            echo "::warning::Not publishing ${TAG}: CSC_LINK / CSC_KEY_PASSWORD are not set, so the macOS build is unsigned. See the header of release.yml."
          elif [ "$HAVE_APPLE_ID" != "true" ] && [ "$HAVE_API_KEY" != "true" ]; then
            echo "::warning::Not publishing ${TAG}: no notarization credentials (APPLE_ID… or APPLE_API_KEY…), so Gatekeeper would block the macOS build. See the header of release.yml."
          else
            PUBLISH=true
            echo "::notice::Publishing ${TAG}."
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

  # ── Build the installers on each native runner ──────────────────────────────
  # Chip Hippo's build job, step for step, with Rest Hippo's SignPath steps for
  # Windows. Each runner builds both architectures for its platform.
  build:
    name: Build installers (${{ matrix.os }})
    needs: [check, plan]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # the SignPath action downloads the uploaded artifact by id
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dist-mac
          - os: ubuntu-latest
            target: dist-linux
          - os: windows-latest
            target: dist-win
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # electron-builder fetches the Electron binary (~100 MB) on every runner,
      # with no retry of its own; Chip Hippo lost a release to one reset
      # connection. Cached on the lockfile, so an Electron bump fetches once.
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      # Windows runners lack make and rsync; MSYS2 provides them, so the same
      # `make dist-win` recipe runs unchanged.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          install: make rsync
          path-type: inherit

      # Built UNSIGNED; SignPath signs the installers out of band, below.
      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        shell: "msys2 {0}"
        run: |
          for attempt in 1 2 3; do
            if make ${{ matrix.target }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt ${attempt} failed; retrying in $(( attempt * 20 ))s"
              sleep $(( attempt * 20 ))
            fi
          done
          echo "::error::Build failed after 3 attempts"
          exit 1

      # ── Windows Authenticode via SignPath Foundation (Rest Hippo's steps) ───
      # Skipped until vars.SIGNPATH_ORGANIZATION_ID is set; see the header.
      - name: Upload unsigned Windows installers for signing
        id: unsigned-win
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-win
          path: build/electron/dist/*.exe
          if-no-files-found: error
          retention-days: 1 # a hand-off to SignPath only; never published

      - name: Sign Windows installers with SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned-win.outputs.artifact-id }}
          wait-for-completion: true
          # The signed installers are extracted over the unsigned ones.
          output-artifact-directory: build/electron/dist
      # (Rest Hippo follows this with a step that re-hashes latest.yml for its
      # auto-updater. JsonHippo has no updater and writes no latest.yml.)

      - name: Build installers (macOS / Linux)
        if: runner.os != 'Windows'
        # Chip Hippo's indirection, for Chip Hippo's reason: an `env:` entry for
        # a secret that is not set still DEFINES the variable, as an empty
        # string, and electron-builder reads an empty CSC_LINK as a certificate
        # path — the current directory — and fails "not a file". So the secrets
        # arrive under other names and are exported only when non-empty.
        env:
          INPUT_CSC_LINK: ${{ secrets.CSC_LINK }}
          INPUT_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          INPUT_APPLE_ID: ${{ secrets.APPLE_ID }}
          INPUT_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          INPUT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INPUT_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          INPUT_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          INPUT_APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -n "$INPUT_CSC_LINK" ]; then
            export CSC_LINK="$INPUT_CSC_LINK"
            export CSC_KEY_PASSWORD="$INPUT_CSC_KEY_PASSWORD"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            # Notarization only alongside a certificate: notarytool rejects an
            # unsigned app, so credentials without one would fail a build that
            # would otherwise succeed unsigned.
            if [ -n "$INPUT_APPLE_ID" ]; then
              export APPLE_ID="$INPUT_APPLE_ID"
              export APPLE_APP_SPECIFIC_PASSWORD="$INPUT_APPLE_APP_SPECIFIC_PASSWORD"
              export APPLE_TEAM_ID="$INPUT_APPLE_TEAM_ID"
            elif [ -n "$INPUT_APPLE_API_KEY_BASE64" ]; then
              # notarytool takes the key as a FILE. RUNNER_TEMP is emptied when
              # the job ends, however it ends.
              printf '%s' "$INPUT_APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-api-key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/notary-api-key.p8"
              export APPLE_API_KEY_ID="$INPUT_APPLE_API_KEY_ID"
              export APPLE_API_ISSUER="$INPUT_APPLE_API_ISSUER"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          for attempt in 1 2 3; do
            if make ${{ matrix.target }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt ${attempt} failed; retrying in $(( attempt * 20 ))s"
              sleep $(( attempt * 20 ))
            fi
          done
          echo "::error::Build failed after 3 attempts"
          exit 1

      # A certificate that was set but not used, or a notarization that quietly
      # did not happen, still produces a .dmg — so when signing is configured,
      # prove it on both apps rather than trusting the build log.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        env:
          INPUT_CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "$INPUT_CSC_LINK" ]; then
            echo "::notice::macOS signing is not configured; these builds are unsigned."
            exit 0
          fi
          for app in build/electron/dist/mac*/JsonHippo.app; do
            echo "── $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application" \
              || { echo "::error::$app is not signed with a Developer ID Application certificate"; exit 1; }
            xcrun stapler validate "$app" \
              || { echo "::error::$app carries no notarization ticket"; exit 1; }
          done

      - name: Upload installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installers-${{ matrix.os }}
          path: |
            build/electron/dist/*.dmg
            build/electron/dist/*.exe
            build/electron/dist/*.AppImage
          if-no-files-found: error
          # The hand-off to the release job; also the only copy of a build that
          # was not published, kept a week for trying it out.
          retention-days: 7

  # ── Publish the GitHub Release ──────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      # Exactly these six, by name. A seventh (a combined installer, a stray
      # build) or a missing one fails the release instead of shipping it.
      - name: Check the six installers
        env:
          V: ${{ needs.plan.outputs.version }}
        run: |
          expected=$(printf '%s\n' \
            "JsonHippo-${V}-arm64.dmg" \
            "JsonHippo-${V}-x64.dmg" \
            "JsonHippo-Setup-${V}-x64.exe" \
            "JsonHippo-Setup-${V}-arm64.exe" \
            "JsonHippo-${V}-x86_64.AppImage" \
            "JsonHippo-${V}-arm64.AppImage" | sort)
          actual=$(ls artifacts | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::The installers are not the six expected."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          ls -l artifacts

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: JsonHippo ${{ needs.plan.outputs.tag }}
          files: artifacts/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
