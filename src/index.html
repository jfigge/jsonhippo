<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Pasted JSON is untrusted text that ends up in the DOM, so no inline
       script and no inline style attributes anywhere: every script is a file,
       and the only third-party origin is the pinned jQuery on cdnjs. Styles
       set from JS go through element.style (CSSOM), which style-src allows. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A JSON viewer that tells you exactly where it broke: pinpoint errors, smart paste of escaped JSON, and a tree you can filter.">
  <meta name="color-scheme" content="light dark">
  <title>JsonHippo — JSON viewer, formatter and validator</title>
  <!-- The app's public address. If it moves (jsonhippo.com), change these. -->
  <link rel="canonical" href="https://hippoherd.com/jsonhippo/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hippo Herd">
  <meta property="og:title" content="JsonHippo — a JSON viewer that tells you exactly where it broke">
  <meta property="og:description" content="Pinpoint errors for JSON that will not parse, smart paste of escaped JSON, and a tree you can filter. Free, in the browser, nothing uploaded.">
  <meta property="og:url" content="https://hippoherd.com/jsonhippo/">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="img/jsonhippo.svg">
  <link rel="stylesheet" href="css/app.css">
  <!-- Applies the saved theme before first paint, so there is no flash. -->
  <script src="js/theme.js"></script>
  <!-- jQuery for the tree and filter. If cdnjs is blocked, app.js loads
       vendor/jquery.min.js (the same file, byte for byte) instead. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>

<!-- Icon sprite. Every icon is drawn in currentColor and told apart by its
     shape, never by colour alone. -->
<svg class="jh-sprite" aria-hidden="true" focusable="false">
  <symbol id="jh-i-object" viewBox="0 0 16 16"><path d="M5.5 2.5C4 2.5 4 3.5 4 4.5v1.8C4 7.3 3.4 8 2.5 8c.9 0 1.5.7 1.5 1.7v1.8c0 1 0 2 1.5 2M10.5 2.5c1.5 0 1.5 1 1.5 2v1.8c0 1 .6 1.7 1.5 1.7-.9 0-1.5.7-1.5 1.7v1.8c0 1 0 2-1.5 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-array" viewBox="0 0 16 16"><path d="M5.5 2.5H3.5v11h2M10.5 2.5h2v11h-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-string" viewBox="0 0 16 16"><path d="M3 3.5v3M5.5 3.5v3M10.5 3.5v3M13 3.5v3M3 11.5h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-number" viewBox="0 0 16 16"><path d="M6.5 2.5l-1 11M11 2.5l-1 11M3 6h10.5M2.5 10H13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-boolean" viewBox="0 0 16 16"><rect x="1.5" y="4.5" width="13" height="7" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="8" r="2" fill="currentColor"/></symbol>
  <symbol id="jh-i-null" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.2 11.8l7.6-7.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-chevron" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-format" viewBox="0 0 16 16"><path d="M2.5 3.5h11M5 6.5h8.5M5 9.5h8.5M2.5 12.5h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-minify" viewBox="0 0 16 16"><path d="M2.5 6h11M2.5 10h11M8 1.5V4.5M6.5 3L8 4.5 9.5 3M8 14.5v-3M6.5 13L8 11.5 9.5 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-unescape" viewBox="0 0 16 16"><path d="M3 2.5l4.5 11M10 3.5v3M12.5 3.5v3M9.5 12.5h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5v-.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="jh-i-clear" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-open" viewBox="0 0 16 16"><path d="M1.5 4V12.5a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V5.5a1 1 0 0 0-1-1H8L6.5 2.5h-4a1 1 0 0 0-1 1.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-expand" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 13.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-collapse" viewBox="0 0 16 16"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 2.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-up" viewBox="0 0 16 16"><path d="M3.5 10.5L8 6l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-down" viewBox="0 0 16 16"><path d="M3.5 5.5L8 10l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-warn" viewBox="0 0 16 16"><path d="M8 2.2l6.3 11.3H1.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.6v3.2M8 11.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-target" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-system" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></symbol>
  <symbol id="jh-i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="jh-i-moon" viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="jh-i-github" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></symbol>
</svg>

<header class="jh-header">
  <a class="jh-brand" href="./" aria-label="JsonHippo home">
    <img class="jh-logo" src="img/jsonhippo.svg" width="28" height="28" alt="">
    <span class="jh-name">JsonHippo</span>
  </a>
  <span class="jh-tagline">A JSON viewer that tells you exactly where it broke</span>
  <div class="jh-header-actions">
    <button type="button" class="jh-btn jh-btn--ghost" id="jh-theme" aria-label="Theme: follow the system">
      <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-system"/></svg>
      <span class="jh-theme-label">System</span>
    </button>
    <a class="jh-btn jh-btn--ghost" href="https://github.com/jfigge/jsonhippo" rel="noopener noreferrer">
      <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-github"/></svg>
      <span>GitHub</span>
    </a>
  </div>
</header>

<div class="jh-tabs" role="tablist" aria-label="View">
  <!-- Tree comes first in the bar, but the page opens on Text: that is
       where the JSON has to go in before there is a tree to show. -->
  <button type="button" class="jh-tab" id="jh-tab-tree" role="tab" aria-selected="false" aria-controls="jh-panel-tree" tabindex="-1">Tree</button>
  <button type="button" class="jh-tab jh-tab--active" id="jh-tab-text" role="tab" aria-selected="true" aria-controls="jh-panel-text">Text</button>
  <button type="button" class="jh-tab" id="jh-tab-schema" role="tab" aria-selected="false" aria-controls="jh-panel-schema" tabindex="-1">Schema</button>
  <button type="button" class="jh-tab" id="jh-tab-diff" role="tab" aria-selected="false" aria-controls="jh-panel-diff" tabindex="-1">Diff</button>
</div>

<main class="jh-main">

  <!-- ── Text ─────────────────────────────────────────────────────────── -->
  <section class="jh-panel" id="jh-panel-text" role="tabpanel" aria-labelledby="jh-tab-text">
    <div class="jh-toolbar" role="toolbar" aria-label="Text tools">
      <button type="button" class="jh-btn" data-action="format" title="Pretty-print (Ctrl/⌘+Enter)">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-format"/></svg><span>Format</span>
      </button>
      <button type="button" class="jh-btn" data-action="minify" title="Remove all whitespace">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-minify"/></svg><span>Minify</span>
      </button>
      <button type="button" class="jh-btn" data-action="unescape" title="Unescape escaped JSON">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-unescape"/></svg><span>Unescape</span>
      </button>
      <span class="jh-toolbar-sep" aria-hidden="true"></span>
      <button type="button" class="jh-btn" data-action="copy" title="Copy to the clipboard">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-copy"/></svg><span>Copy</span>
      </button>
      <button type="button" class="jh-btn" data-action="clear" title="Clear the text">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-clear"/></svg><span>Clear</span>
      </button>
      <button type="button" class="jh-btn" data-action="open" title="Load a file from this computer (it is read locally, never uploaded)">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-open"/></svg><span>Load from file</span>
      </button>
      <input type="file" class="jh-file" id="jh-file" accept=".json,.txt,.log,application/json,text/plain" hidden>

      <div class="jh-toolbar-end">
        <select id="jh-indent" class="jh-select jh-select--quiet" aria-label="Indent for Format" title="Indent for Format">
          <option value="2">Indent: 2 spaces</option>
          <option value="4">Indent: 4 spaces</option>
          <option value="tab">Indent: tab</option>
        </select>
        <label class="jh-check" title="When you paste escaped JSON, unescape it automatically">
          <input type="checkbox" id="jh-auto-unescape" checked>
          <span>Auto-unescape</span>
        </label>
        <label class="jh-check" title="Warn about valid JSON that is probably a mistake: duplicate keys, empty keys, numbers that lose precision">
          <input type="checkbox" id="jh-lint" checked>
          <span>Warnings</span>
        </label>
      </div>
    </div>

    <div class="jh-notice" id="jh-notice" role="status" hidden>
      <span class="jh-notice-text"></span>
      <button type="button" class="jh-link" data-action="undo-unescape">Undo</button>
      <button type="button" class="jh-notice-close" data-action="dismiss-notice" aria-label="Dismiss">×</button>
    </div>

    <div class="jh-editor">
      <div class="jh-gutter" aria-hidden="true"><div class="jh-gutter-lines"></div></div>
      <div class="jh-input-wrap">
        <div class="jh-error-band" hidden></div>
        <div class="jh-error-mark" hidden></div>
        <textarea id="jh-input" class="jh-input" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="JSON input" placeholder="Paste JSON here, type it, or load a file. Escaped JSON is unescaped automatically on paste."></textarea>
      </div>
    </div>
  </section>

  <!-- ── Tree ─────────────────────────────────────────────────────────── -->
  <section class="jh-panel" id="jh-panel-tree" role="tabpanel" aria-labelledby="jh-tab-tree" hidden>
    <!-- One quiet row: the filter and its options, then the expand controls.
         Everything else on the tab is the tree itself. -->
    <div class="jh-toolbar jh-tree-toolbar" role="toolbar" aria-label="Tree tools">
      <input type="search" class="jh-filter" id="jh-filter" placeholder="Filter keys and values, or a $.path   ( / )" aria-label="Filter the tree" aria-describedby="jh-filter-count jh-filter-error" autocomplete="off" spellcheck="false">
      <select class="jh-select jh-select--quiet" id="jh-filter-scope" aria-label="Match against" title="Match against">
        <option value="both" selected>Keys &amp; values</option>
        <option value="keys">Keys</option>
        <option value="values">Values</option>
      </select>
      <button type="button" class="jh-toggle-btn" id="jh-filter-case" aria-pressed="false" title="Match case">Aa</button>
      <button type="button" class="jh-toggle-btn" id="jh-filter-regex" aria-pressed="false" title="Regular expression">.*</button>
      <span class="jh-filter-count" id="jh-filter-count" aria-live="polite"></span>
      <button type="button" class="jh-icon-btn" id="jh-filter-prev" aria-label="Previous match (Shift+Enter)" title="Previous match (Shift+Enter)" disabled>
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-up"/></svg>
      </button>
      <button type="button" class="jh-icon-btn" id="jh-filter-next" aria-label="Next match (Enter)" title="Next match (Enter)" disabled>
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-down"/></svg>
      </button>
      <span class="jh-toolbar-sep" aria-hidden="true"></span>
      <button type="button" class="jh-icon-btn" data-tree="expand-all" aria-label="Expand all" title="Expand all">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-expand"/></svg>
      </button>
      <button type="button" class="jh-icon-btn" data-tree="collapse-all" aria-label="Collapse all" title="Collapse all">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-collapse"/></svg>
      </button>
      <select class="jh-select jh-select--quiet" id="jh-level" aria-label="Expand to level" title="Expand to level">
        <option value="" selected>Level…</option>
        <option value="1">Level 1</option>
        <option value="2">Level 2</option>
        <option value="3">Level 3</option>
        <option value="4">Level 4</option>
        <option value="5">Level 5</option>
        <option value="6">Level 6</option>
        <option value="8">Level 8</option>
        <option value="10">Level 10</option>
      </select>
      <span class="jh-filter-error" id="jh-filter-error" role="alert"></span>
      <div class="jh-confirm" id="jh-confirm" hidden>
        <span class="jh-confirm-text"></span>
        <button type="button" class="jh-btn jh-btn--primary" data-tree="confirm-yes">Expand</button>
        <button type="button" class="jh-btn" data-tree="confirm-no">Cancel</button>
      </div>
    </div>

    <div class="jh-tree-wrap">
      <ul class="jh-tree" id="jh-tree" role="tree" aria-label="JSON tree"></ul>
      <div class="jh-tree-message" id="jh-tree-message" hidden>
        <p class="jh-tree-message-title"></p>
        <p class="jh-tree-message-hint"></p>
        <button type="button" class="jh-btn jh-btn--primary" data-tree="go-to-error" hidden>
          <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-target"/></svg><span>Go to error</span>
        </button>
      </div>
    </div>

    <div class="jh-detail" id="jh-detail" hidden>
      <code class="jh-detail-path"></code>
      <span class="jh-detail-kind"></span>
      <span class="jh-detail-warn" hidden></span>
      <span class="jh-detail-actions">
        <button type="button" class="jh-btn" data-tree="copy-path">
          <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-copy"/></svg><span>Copy path</span>
        </button>
        <button type="button" class="jh-btn" data-tree="copy-value">
          <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-copy"/></svg><span>Copy value</span>
        </button>
        <button type="button" class="jh-btn" data-tree="show-in-text">
          <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-target"/></svg><span>Show in text</span>
        </button>
      </span>
    </div>
  </section>

  <!-- ── Schema ───────────────────────────────────────────────────────── -->
  <!-- A JSON Schema inferred from the Text tab's JSON each time the tab
       opens. Read-only: the JSON it came from is never changed. -->
  <section class="jh-panel" id="jh-panel-schema" role="tabpanel" aria-labelledby="jh-tab-schema" hidden>
    <div class="jh-toolbar" role="toolbar" aria-label="Schema tools">
      <button type="button" class="jh-btn" data-schema="copy" title="Copy the schema to the clipboard">
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-copy"/></svg><span>Copy</span>
      </button>

      <div class="jh-toolbar-end">
        <select id="jh-schema-draft" class="jh-select jh-select--quiet" aria-label="JSON Schema draft" title="JSON Schema draft">
          <option value="2020-12">Draft 2020-12</option>
          <option value="07">Draft-07</option>
        </select>
        <label class="jh-check" title="List the keys that every object at a position has as required">
          <input type="checkbox" id="jh-schema-required" checked>
          <span>Required keys</span>
        </label>
      </div>
    </div>

    <div class="jh-notice" role="status" hidden></div>

    <div class="jh-editor">
      <div class="jh-gutter" aria-hidden="true"><div class="jh-gutter-lines"></div></div>
      <div class="jh-input-wrap">
        <textarea class="jh-input" readonly spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="JSON Schema inferred from the JSON"></textarea>
      </div>
    </div>

    <div class="jh-schema-message" hidden>
      <p class="jh-schema-message-title"></p>
      <p class="jh-schema-message-hint"></p>
      <button type="button" class="jh-btn jh-btn--primary" data-schema="go-to-error" hidden>
        <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-target"/></svg><span>Go to error</span>
      </button>
    </div>
  </section>

  <!-- ── Diff ─────────────────────────────────────────────────────────── -->
  <section class="jh-panel" id="jh-panel-diff" role="tabpanel" aria-labelledby="jh-tab-diff" hidden>
    <div class="jh-toolbar jh-diff-toolbar" role="toolbar" aria-label="Diff tools">
      <div class="jh-reorder">
        <span class="jh-reorder-label" id="jh-reorder-label">Reorder</span>
        <div class="jh-segmented" role="radiogroup" aria-labelledby="jh-reorder-label" title="Lay one side out in the other's order">
          <input type="radio" class="jh-segmented-input" name="jh-reorder" id="jh-reorder-left" value="left">
          <label class="jh-segmented-option" for="jh-reorder-left">Left master</label>
          <input type="radio" class="jh-segmented-input" name="jh-reorder" id="jh-reorder-off" value="off" checked>
          <label class="jh-segmented-option" for="jh-reorder-off">Off</label>
          <input type="radio" class="jh-segmented-input" name="jh-reorder" id="jh-reorder-right" value="right">
          <label class="jh-segmented-option" for="jh-reorder-right">Right master</label>
        </div>
      </div>
      <div class="jh-toolbar-end">
        <span class="jh-diff-count" id="jh-diff-count" aria-live="polite"></span>
        <button type="button" class="jh-icon-btn" id="jh-diff-prev" aria-label="Previous difference (Alt+↑)" title="Previous difference (Alt+↑)" disabled>
          <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-up"/></svg>
        </button>
        <button type="button" class="jh-icon-btn" id="jh-diff-next" aria-label="Next difference (Alt+↓)" title="Next difference (Alt+↓)" disabled>
          <svg class="jh-icon" aria-hidden="true"><use href="#jh-i-down"/></svg>
        </button>
      </div>
    </div>
    <div class="jh-diff-panes">
      <div class="jh-diff-pane" data-side="left">
        <div class="jh-pane-head">
          <span class="jh-pane-title">Left</span>
          <span class="jh-pane-notice" role="status" hidden>
            <span class="jh-pane-notice-text"></span>
            <button type="button" class="jh-link" data-pane="undo">Undo</button>
            <button type="button" class="jh-notice-close" data-pane="dismiss" aria-label="Dismiss">×</button>
          </span>
          <span class="jh-pane-actions">
            <button type="button" class="jh-icon-btn" data-pane="format" aria-label="Format Left" title="Format (Ctrl/⌘+Enter)"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-format"/></svg></button>
            <button type="button" class="jh-icon-btn" data-pane="unescape" aria-label="Unescape Left" title="Unescape"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-unescape"/></svg></button>
            <button type="button" class="jh-icon-btn" data-pane="copy" aria-label="Copy Left" title="Copy"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-copy"/></svg><span>Copy</span></button>
            <button type="button" class="jh-icon-btn" data-pane="clear" aria-label="Clear Left" title="Clear"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-clear"/></svg></button>
            <button type="button" class="jh-icon-btn" data-pane="open" aria-label="Load a file into Left" title="Load from file"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-open"/></svg></button>
          </span>
        </div>
        <div class="jh-editor">
          <div class="jh-gutter" aria-hidden="true"><div class="jh-gutter-lines"></div></div>
          <div class="jh-input-wrap">
            <div class="jh-diff-marks" aria-hidden="true"></div>
            <div class="jh-error-band" hidden></div>
            <textarea class="jh-input" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Left JSON" placeholder="Paste, type or load JSON."></textarea>
          </div>
        </div>
      </div>
      <div class="jh-diff-pane" data-side="right">
        <div class="jh-pane-head">
          <span class="jh-pane-title">Right</span>
          <span class="jh-pane-notice" role="status" hidden>
            <span class="jh-pane-notice-text"></span>
            <button type="button" class="jh-link" data-pane="undo">Undo</button>
            <button type="button" class="jh-notice-close" data-pane="dismiss" aria-label="Dismiss">×</button>
          </span>
          <span class="jh-pane-actions">
            <button type="button" class="jh-icon-btn" data-pane="format" aria-label="Format Right" title="Format (Ctrl/⌘+Enter)"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-format"/></svg></button>
            <button type="button" class="jh-icon-btn" data-pane="unescape" aria-label="Unescape Right" title="Unescape"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-unescape"/></svg></button>
            <button type="button" class="jh-icon-btn" data-pane="copy" aria-label="Copy Right" title="Copy"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-copy"/></svg><span>Copy</span></button>
            <button type="button" class="jh-icon-btn" data-pane="clear" aria-label="Clear Right" title="Clear"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-clear"/></svg></button>
            <button type="button" class="jh-icon-btn" data-pane="open" aria-label="Load a file into Right" title="Load from file"><svg class="jh-icon" aria-hidden="true"><use href="#jh-i-open"/></svg></button>
          </span>
        </div>
        <div class="jh-editor">
          <div class="jh-gutter" aria-hidden="true"><div class="jh-gutter-lines"></div></div>
          <div class="jh-input-wrap">
            <div class="jh-diff-marks" aria-hidden="true"></div>
            <div class="jh-error-band" hidden></div>
            <textarea class="jh-input" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Right JSON" placeholder="Paste the JSON to compare against here, type it, or load a file."></textarea>
          </div>
        </div>
      </div>
    </div>
    <input type="file" class="jh-file" id="jh-diff-file" accept=".json,.txt,.log,application/json,text/plain" hidden>
  </section>
</main>

<!-- Warnings (lint): the full list, opened from the status bar. -->
<section class="jh-warnings" id="jh-warnings" aria-labelledby="jh-warnings-title" hidden>
  <div class="jh-warnings-head">
    <span class="jh-warnings-title" id="jh-warnings-title">Warnings</span>
    <button type="button" class="jh-notice-close" data-warnings="close" aria-label="Close the list of warnings">×</button>
  </div>
  <ol class="jh-warnings-list"></ol>
</section>

<footer class="jh-status" id="jh-status" role="status" aria-live="polite">
  <span class="jh-status-main">Paste JSON, type it, or load a file.</span>
</footer>

</body>
</html>
